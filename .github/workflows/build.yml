name: Build Multiplatform project
on:
  push:
    branches:
      - main
      - feature/ci_setup
  pull_request:

jobs:
  common-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run common WebView tests on JVM
        run: ./gradlew :webview:desktopTest

  android-webview-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run real Android WebView instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :sample:androidApp:connectedDebugAndroidTest
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-webview-test-reports
          path: |
            sample/androidApp/build/outputs/androidTest-results/connected/
            sample/androidApp/build/reports/androidTests/connected/

  ios-webview-tests:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run real WKWebView XCTest
        run: scripts/run_ios_webview_tests.sh
      - name: Upload iOS test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-webview-test-results
          path: build/ios-test-results/*.xcresult

  build-multiplatform-project:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-14, windows-2022 ]
        gradle: [ 8.3 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Build Multiplatform project
        shell: bash
        run: ./gradlew assemble
